<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Bond Fire - Fan the Flames</title>
    <script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-database-compat.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Fraunces:wght@600;700&family=Space+Grotesk:wght@400;600;700&display=swap');

        :root {
            --bg-deep: #0b0f14;
            --bg-warm: #1f1a16;
            --accent: #ff6b6b;
            --accent-strong: #ff8855;
            --text-muted: #b6b0a6;
            --panel: rgba(255, 255, 255, 0.06);
            --panel-strong: rgba(255, 255, 255, 0.12);
            --fan-color: #ff6b6b;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Space Grotesk', 'Segoe UI', sans-serif;
            background: radial-gradient(circle at top, rgba(255, 150, 80, 0.15), transparent 45%),
                linear-gradient(135deg, var(--bg-deep) 0%, var(--bg-warm) 100%);
            color: #fff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            overflow-y: auto;
            overflow-x: hidden;
            padding: 20px 0;
        }

        .container {
            text-align: center;
            padding: 20px;
            max-width: 500px;
            width: 90%;
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        h1 {
            font-family: 'Fraunces', 'Times New Roman', serif;
            font-size: 2.6em;
            margin-bottom: 10px;
            background: linear-gradient(45deg, var(--accent), #ffd36b);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .subtitle {
            font-size: 1.2em;
            color: var(--text-muted);
            margin-bottom: 40px;
        }

        .status {
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 30px;
            font-size: 1.1em;
            font-weight: 500;
            transition: all 0.3s ease;
        }

        .status.connecting {
            background: rgba(255, 193, 7, 0.2);
            border: 2px solid rgba(255, 193, 7, 0.5);
            color: #ffc107;
        }

        .status.connected {
            background: rgba(76, 175, 80, 0.2);
            border: 2px solid rgba(76, 175, 80, 0.5);
            color: #4caf50;
        }

        .status.error {
            background: rgba(244, 67, 54, 0.2);
            border: 2px solid rgba(244, 67, 54, 0.5);
            color: #f44336;
        }

        .fire-button {
            width: 250px;
            height: 250px;
            border-radius: 50%;
            border: 5px solid var(--fan-color);
            background: radial-gradient(circle at 30% 30%, #ff9068, var(--fan-color), #c44569);
            font-size: 1.5em;
            font-weight: bold;
            color: white;
            cursor: pointer;
            margin: 20px auto;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 10px 40px rgba(255, 107, 107, 0.4), 0 0 0 6px rgba(255, 255, 255, 0.03);
            transition: all 0.3s ease;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        .fire-button:active {
            transform: scale(0.95);
            box-shadow: 0 5px 20px rgba(255, 107, 107, 0.6);
        }

        .fire-button.shaking {
            animation: shake-pulse 0.5s ease;
            background: radial-gradient(circle at 30% 30%, #ffb068, #ff8b6b, #ff4569);
            box-shadow: 0 20px 60px rgba(255, 107, 107, 0.8);
        }

        @keyframes shake-pulse {

            0%,
            100% {
                transform: scale(1);
            }

            50% {
                transform: scale(1.1);
            }
        }

        .instructions {
            margin-top: 30px;
            padding: 20px;
            background: var(--panel);
            border-radius: 10px;
            font-size: 1em;
            line-height: 1.6;
        }



        .permission-prompt {
            padding: 20px;
            background: rgba(255, 193, 7, 0.15);
            border: 2px solid rgba(255, 193, 7, 0.4);
            border-radius: 10px;
            margin-bottom: 20px;
            max-height: 60vh;
            overflow-y: auto;
        }

        .permission-prompt p {
            margin: 10px 0;
            line-height: 1.5;
        }

        .permission-prompt ol {
            text-align: left;
            margin: 15px 20px;
            font-size: 0.9em;
            line-height: 1.6;
        }

        .skip-note {
            font-size: 0.95em;
            color: var(--text-muted);
            margin-top: 15px;
            padding: 15px;
            background: var(--panel);
            border-radius: 8px;
        }

        .skip-note strong {
            color: #4caf50;
        }

        details {
            margin-top: 20px;
            padding: 15px;
            background: var(--panel);
            border-radius: 10px;
            text-align: center;
        }

        details summary {
            cursor: pointer;
            font-weight: 600;
            margin-bottom: 15px;
            padding: 10px;
            border-radius: 8px;
            transition: background 0.2s ease;
        }

        details summary:hover {
            background: var(--panel-strong);
        }

        details ol {
            text-align: left;
            font-size: 0.85em;
            line-height: 1.6;
            margin: 15px auto;
            max-width: 300px;
            padding-left: 25px;
        }

        details .btn {
            margin-top: 15px;
        }

        .btn {
            background: var(--accent);
            color: white;
            border: none;
            padding: 12px 22px;
            border-radius: 25px;
            font-size: 1.0em;
            font-weight: 600;
            cursor: pointer;
            margin-top: 15px;
            transition: all 0.3s ease;
        }

        .btn:hover {
            background: var(--accent-strong);
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(255, 107, 107, 0.4);
        }

        .btn:active {
            transform: translateY(0);
        }

        .color-picker {
            width: 100%;
            background: var(--panel);
            border-radius: 16px;
            padding: 16px 18px;
            margin: 10px 0 10px;
            border: 1px solid rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(8px);
        }

        .color-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }

        .color-title {
            font-weight: 700;
            font-size: 1.05em;
        }

        .color-selected {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 0.95em;
            color: var(--text-muted);
        }

        .color-dot {
            width: 14px;
            height: 14px;
            border-radius: 50%;
            background: var(--fan-color);
            box-shadow: 0 0 10px rgba(255, 255, 255, 0.2);
        }

        .color-swatches {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 10px;
        }

        .color-swatch {
            width: 100%;
            aspect-ratio: 1 / 1;
            border-radius: 14px;
            border: 2px solid rgba(255, 255, 255, 0.08);
            cursor: pointer;
            transition: transform 0.2s ease, box-shadow 0.2s ease, border-color 0.2s ease;
            position: relative;
        }

        .color-swatch.selected {
            border-color: rgba(255, 255, 255, 0.7);
            box-shadow: 0 0 0 3px rgba(255, 255, 255, 0.15), 0 10px 20px rgba(0, 0, 0, 0.35);
            transform: translateY(-2px) scale(1.02);
        }

        .color-swatch::after {
            content: '';
            position: absolute;
            inset: 6px;
            border-radius: 10px;
            border: 1px solid rgba(255, 255, 255, 0.3);
            opacity: 0.3;
        }

        @media (max-width: 480px) {
            .color-swatches {
                grid-template-columns: repeat(5, minmax(0, 1fr));
            }

            .fire-button {
                width: 220px;
                height: 220px;
            }
        }
    </style>
</head>

<body>
    <div class="container">
        <h1>🔥 Bond Fire</h1>
        <p class="subtitle">Fan the flames with your phone</p>

        <div id="status" class="status connecting">Connecting to RTDB...</div>

        <div id="permission-prompt" class="permission-prompt" style="display: none;">
            <p><strong>Shake detection</strong></p>
            <p class="permission-note">Tap to enable motion access on iOS.</p>
            <button class="btn" onclick="requestMotionPermission()">Enable</button>
            <p class="permission-hint">Prefer no permissions? Tap the flame instead.</p>
        </div>

        <div class="color-picker">
            <div class="color-header">
                <div class="color-title">Your flame color</div>
                <div class="color-selected">
                    <span class="color-dot" id="selected-color-dot"></span>
                    <span id="selected-color-name">Ember</span>
                </div>
            </div>
            <div class="color-swatches" id="color-swatches"></div>
        </div>

        <div id="fire-button" class="fire-button">
            Shake to Fan
        </div>

        <div class="instructions">
            <strong>Be the wind.</strong><br>
            Shake or tap to feed the fire.
        </div>
    </div>

    <script>
        // Firebase Configuration
        const firebaseConfig = {
            apiKey: "AIzaSyDummyKeyForLocalDev",
            authDomain: "bondfire-app-d778f.firebaseapp.com",
            databaseURL: "https://bondfire-app-d778f-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "bondfire-app-d778f",
            storageBucket: "bondfire-app-d778f.appspot.com",
            messagingSenderId: "123456789",
            appId: "1:123456789:web:abcdef123456"
        };

        // Initialize Firebase (retry until SDK is available)
        let app = null;
        let database = null;
        let firebaseReady = false;
        let firebaseInitAttempts = 0;
        const FIREBASE_RETRY_MS = 500;

        // Configuration
        const SHAKE_THRESHOLD = 15; // m/s² (lowered from 20 for better sensitivity)
        const SHAKE_COOLDOWN = 500; // ms between shakes

        const FAN_COLORS = [
            { name: 'Ember', hex: '#ff6b6b', rgb: [255, 107, 107] },
            { name: 'Citrus', hex: '#ffb84d', rgb: [255, 184, 77] },
            { name: 'Lava', hex: '#ff7a45', rgb: [255, 122, 69] },
            { name: 'Sky', hex: '#55c9ff', rgb: [85, 201, 255] },
            { name: 'Plum', hex: '#c08bff', rgb: [192, 139, 255] }
        ];

        // State
        let userId = getUserId();
        let lastShakeTime = 0;
        let motionPermissionGranted = false;
        let isConnected = true; // Firebase is always "connected" once initialized
        let selectedColor = null;

        // Get or create user ID
        function getUserId() {
            let id = localStorage.getItem('bondfire_user_id');
            if (!id) {
                id = 'user_' + Math.random().toString(36).substr(2, 9);
                localStorage.setItem('bondfire_user_id', id);
            }
            return id;
        }

        // Update status message
        function updateStatus(message, type = 'connecting') {
            const statusEl = document.getElementById('status');
            statusEl.textContent = message;
            statusEl.className = `status ${type}`;
        }

        // Initialize Firebase connection and show status
        function initializeFirebase() {
            if (firebaseReady) {
                return true;
            }

            if (typeof firebase === 'undefined') {
                firebaseInitAttempts++;
                if (firebaseInitAttempts === 1) {
                    updateStatus('Connecting to RTDB...', 'connecting');
                }
                setTimeout(initializeFirebase, FIREBASE_RETRY_MS);
                return false;
            }

            try {
                if (firebase.apps && firebase.apps.length) {
                    app = firebase.app();
                } else {
                    app = firebase.initializeApp(firebaseConfig);
                }
                database = firebase.database();
                firebaseReady = true;
                console.log('✅ Firebase SDK loaded and initialized');
                updateStatus('🔥 Connected - Ready to Fan!', 'connected');
                return true;
            } catch (err) {
                console.error('❌ Firebase initialization failed:', err);
                updateStatus('RTDB init failed - check console', 'error');
                return false;
            }
        }

        // Publish shake event to Firebase Realtime Database
        function publishShake() {
            if (!firebaseReady || !database) {
                const initialized = initializeFirebase();
                if (!initialized) {
                    console.warn('Firebase not ready');
                    return;
                }
            }

            try {
                const timestampMs = Date.now();
                const timestampSec = Math.floor(timestampMs / 1000);
                const shakeRef = database.ref(`shakes/${timestampSec}/${userId}`);
                shakeRef.set({
                    user_id: userId,
                    timestamp: timestampSec,
                    timestamp_ms: timestampMs,
                    color_name: selectedColor ? selectedColor.name : null,
                    color_hex: selectedColor ? selectedColor.hex : null,
                    color_rgb: selectedColor ? selectedColor.rgb : null
                }).then(() => {
                    console.log('✅ Shake published to Firebase!');
                    // Visual feedback
                    const button = document.getElementById('fire-button');
                    button.classList.add('shaking');
                    setTimeout(() => button.classList.remove('shaking'), 500);
                }).catch((err) => {
                    console.error('Failed to publish shake:', err);
                });
            } catch (err) {
                console.error('Error publishing shake:', err);
            }
        }

        // Request motion permission (iOS 13+)
        async function requestMotionPermission() {
            if (typeof DeviceMotionEvent !== 'undefined' && typeof DeviceMotionEvent.requestPermission === 'function') {
                try {
                    const permission = await DeviceMotionEvent.requestPermission();
                    if (permission === 'granted') {
                        motionPermissionGranted = true;
                        document.getElementById('permission-prompt').style.display = 'none';
                        setupMotionDetection();
                    } else {
                        console.error('Motion permission denied by user');
                        updateStatus('🖱️ Tap Mode - Button works perfectly!', 'connected');
                        document.getElementById('permission-prompt').style.display = 'none';
                        document.getElementById('fire-button').textContent = 'Tap to Fan';
                    }
                } catch (err) {
                    console.error('Permission request failed:', err);
                    updateStatus('Permission error - check iOS Settings', 'error');
                }
            } else {
                // No permission needed (Android, older iOS)
                motionPermissionGranted = true;
                document.getElementById('permission-prompt').style.display = 'none';
                setupMotionDetection();
            }
        }

        // Detect shake from motion
        function setupMotionDetection() {
            let lastX = 0, lastY = 0, lastZ = 0;
            let motionEventCount = 0;

            console.log('🎯 Motion detection setup started');
            console.log('Permission granted:', motionPermissionGranted);

            window.addEventListener('devicemotion', (event) => {
                motionEventCount++;

                // Log first few events for debugging
                if (motionEventCount <= 3) {
                    console.log(`Motion event #${motionEventCount}:`, event.acceleration);
                }

                if (!motionPermissionGranted) {
                    console.warn('Motion blocked: permission not granted');
                    return;
                }

                const acc = event.accelerationIncludingGravity;
                if (!acc || acc.x === null || acc.y === null || acc.z === null) {
                    if (motionEventCount <= 3) {
                        console.warn('No acceleration data available');
                    }
                    return;
                }

                const deltaX = Math.abs(acc.x - lastX);
                const deltaY = Math.abs(acc.y - lastY);
                const deltaZ = Math.abs(acc.z - lastZ);

                const totalDelta = deltaX + deltaY + deltaZ;

                // Log significant motion for debugging
                if (totalDelta > 10 && motionEventCount % 10 === 0) {
                    console.log(`Motion delta: ${totalDelta.toFixed(1)} (threshold: ${SHAKE_THRESHOLD})`);
                }

                if (totalDelta > SHAKE_THRESHOLD) {
                    const now = Date.now();
                    if (now - lastShakeTime > SHAKE_COOLDOWN) {
                        console.log('🔥 SHAKE DETECTED! Delta:', totalDelta.toFixed(1));
                        publishShake();
                        lastShakeTime = now;
                    }
                }

                lastX = acc.x;
                lastY = acc.y;
                lastZ = acc.z;
            });

            // Test after 2 seconds if events are firing
            setTimeout(() => {
                if (motionEventCount === 0) {
                    console.error('❌ No motion events detected! Device may not support motion sensors.');
                    updateStatus('Motion sensors not available - tap button instead', 'error');
                } else {
                    console.log(`✅ Motion detection active (${motionEventCount} events received)`);
                }
            }, 2000);
        }

        // Initialize
        window.addEventListener('load', () => {
            console.log('🚀 App initializing...');
            console.log('User ID:', userId);
            console.log('Device supports motion?', typeof DeviceMotionEvent !== 'undefined');
            console.log('Needs permission?', typeof DeviceMotionEvent !== 'undefined' && typeof DeviceMotionEvent.requestPermission === 'function');

            setupColorPicker();

            initializeFirebase();

            // Check if motion permission is needed (iOS 13+)
            if (typeof DeviceMotionEvent !== 'undefined' && typeof DeviceMotionEvent.requestPermission === 'function') {
                console.log('📱 iOS device detected - permission required');
                document.getElementById('permission-prompt').style.display = 'block';
            } else {
                console.log('✅ Auto-enabling motion detection (Android/Desktop)');
                motionPermissionGranted = true;
                setupMotionDetection();
            }

            // Handle button tap (alternative to shake)
            document.getElementById('fire-button').addEventListener('click', () => {
                const now = Date.now();
                if (now - lastShakeTime > SHAKE_COOLDOWN) {
                    console.log('🖱️ Button tapped!');
                    publishShake();
                    lastShakeTime = now;
                }
            });
        });

        function setupColorPicker() {
            const swatchContainer = document.getElementById('color-swatches');
            swatchContainer.innerHTML = '';

            const storedHex = localStorage.getItem('bondfire_color_hex');
            const initialColor = FAN_COLORS.find((color) => color.hex === storedHex) ||
                FAN_COLORS[Math.floor(Math.random() * FAN_COLORS.length)];

            FAN_COLORS.forEach((color) => {
                const swatch = document.createElement('button');
                swatch.type = 'button';
                swatch.className = 'color-swatch';
                swatch.style.background = `radial-gradient(circle at 30% 30%, #ffffff55, ${color.hex})`;
                swatch.setAttribute('aria-label', `${color.name} flame color`);
                swatch.addEventListener('click', () => setSelectedColor(color));
                swatchContainer.appendChild(swatch);
            });

            setSelectedColor(initialColor);
        }

        function setSelectedColor(color) {
            selectedColor = color;
            document.documentElement.style.setProperty('--fan-color', color.hex);
            document.getElementById('selected-color-name').textContent = color.name;
            const dot = document.getElementById('selected-color-dot');
            dot.style.background = color.hex;

            const swatches = Array.from(document.querySelectorAll('.color-swatch'));
            swatches.forEach((swatch, index) => {
                if (FAN_COLORS[index].hex === color.hex) {
                    swatch.classList.add('selected');
                } else {
                    swatch.classList.remove('selected');
                }
            });

            localStorage.setItem('bondfire_color_hex', color.hex);
        }
    </script>
</body>

</html>

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bond-fire-vision"
version = "0.1.0"
description = "Vision module for the Empathic Hearth installation."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "ultralytics",
    "opencv-python",
    "numpy",
    "pygame>=2.0.0",
    "pyttsx3>=2.90",
    "pyyaml",
]

[project.optional-dependencies]
legacy = [
    "openai>=1.60.0",
]

[project.scripts]
bond-fire-vision = "bond_fire_vision.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

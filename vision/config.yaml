# Bond Fire Vision Configuration
# Adjust these values without modifying code

# State Machine - Phone Detection Thresholds (seconds)
state_machine:
  fire_entry_dwell: 0.3       # Debounce IDLE -> FIRE to avoid single-frame flicker
  phone_entry_dwell: 0.5      # Debounce PHONE entry to reduce false positives
  phone_exit_dwell: 0.5       # Hysteresis - phone must be absent for this duration to exit PHONE state
  frame_rate: 5               # FPS for celebration display and state timing

# Prompt Generation - Cooldown Durations (seconds)
prompts:
  normal_cooldown: 22         # Minimum time between prompts in non-phone states
  phone_cooldown: 22          # Minimum time between prompts while phone is detected
  same_state_cooldown: 22     # Minimum time between prompts when state is unchanged
  phone_idle_prompt_delay: 2  # Seconds to wait before showing phone-idle prompts
  
# Celebration Effect - Phone Exit Celebration
celebration:
  duration_frames: 10         # Number of frames to display celebration (at frame_rate fps ≈ 2 seconds)
  # celebration audio (party horn) plays automatically with state change
  
# Audio System
audio:
  master_volume: 0.7          # 0.0 to 1.0
  sfx_volume: 0.8             # Sound effects volume multiplier
  music_volume: 0.5           # Background music volume multiplier
  
  # TTS (Text-to-Speech) Configuration
  tts:
    enabled: true
    speech_rate: 140          # WPM (words per minute) - lower = slower, higher = faster
    voice_preference:         # Order of voice selection on macOS
      - daniel                # British English narrator (primary)
      - grandpa               # Male narrator alternative
      - rocko                 # Another male option
      - reed                  # Additional fallback
  
  # Queue Configuration
  audio_queue_size: 50        # Max pending audio commands
  worker_thread_enabled: true # Use background thread for audio playback

# Vision Detection
vision:
  confidence_threshold: 0.08  # YOLO detection confidence for people (0.0 to 1.0) - lower = more sensitive
  phone_confidence_threshold: 0.08  # Very low threshold for phones (smaller, harder to detect)
  person_class_id: 0          # COCO dataset person class
  phone_class_id: 67          # COCO dataset cell phone class
  min_person_area_ratio: 0.08 # Min person bbox area as fraction of frame area (lowered for distant people)
  frame_width: 1920           # Camera capture width
  frame_height: 1080          # Camera capture height
  imgsz: 1920                 # YOLO inference size (match frame width for no downscaling)
  iou_threshold: 0.45         # NMS IOU threshold (lower = more strict, less overlap)
  phone_debounce_frames_detect: 2  # Consecutive frames required to confirm phone presence
  phone_debounce_frames_lose: 3    # Consecutive frames required to confirm phone absence
  phone_persistence_frames: 8      # Keep phone detected for this many frames after last seen

# Fanning Detection (Digital Bellows)
fanning:
  history: 30                 # Number of phone x-positions to keep
  metric: distance            # distance or std
  movement_threshold: 28.0    # Movement threshold for fanning detection
  decay: 0.88                 # Fan power decay per frame when not fanning (lower = faster deflation)
  increase_step: 12.0         # Fan power increase per frame when fanning (increased for immediate response)
  reset_missing: 10           # Frames until history reset when phone missing
  power_threshold: 50.0       # Fan power threshold for FANNING state
  power_hysteresis: 5.0       # Prevents rapid flip-flopping around threshold

# Development/Debugging
debug:
  verbose_logging: false      # Print detailed state transitions and audio events
  log_prompts: false          # Log all generated prompts
  disable_tts: false          # Disable speech synthesis (audio still works for SFX/music)
